#:schema https://mise.jdx.dev/schema/mise.json

[tools]
node = "26"
prek = "0.5.10"
uv = "0.12.10"

"pipx:ansible-core" = { version = "2.22.0", uvx_args = "--python 3.14 --with docker --with requests" }
"pipx:ansible-doctor" = { version= "8.4.4", uvx_args = "--python 3.14 --with ansible-core" }
"pipx:ansible-lint" = { version = "26.11.0", uvx_args = "--python 3.14" }
"pipx:molecule" = { version = "26.11.0", uvx_args = "--python 3.14 --with molecule-hetznercloud --with molecule-plugins[docker] --with pytest --with pytest-testinfra --with-executables-from pytest" }
